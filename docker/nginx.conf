# nginx config for the YNBB static build.
# Runs as the non-root "nginx" user, so the pid and temp files live in /tmp.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    access_log /dev/stdout;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Hashed build output never changes, so cache it for a year.
        location /assets/ {
            include /etc/nginx/ynbb-security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Runtime settings are written at container start. Always revalidate.
        location = /config.js {
            include /etc/nginx/ynbb-security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location = /index.html {
            include /etc/nginx/ynbb-security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # Single-page app fallback: unknown paths get index.html.
        location / {
            include /etc/nginx/ynbb-security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
