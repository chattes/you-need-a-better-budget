# Self-hosting with Docker Compose. See docs/self-hosting.md.
#   GOOGLE_CLIENT_ID=your-id.apps.googleusercontent.com docker compose up -d
# Open http://localhost:8080 (sign-in needs https:// or http://localhost).
services:
  ynbb:
    # Local build uses the repo source. To use the prebuilt ghcr image instead,
    # replace `build: .` with `image: ghcr.io/chattes/you-need-a-better-budget:latest`.
    build: .
    container_name: ynbb
    ports:
      - "8080:8080"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
